# Compose de deploy OCI (dev/prod).
# Requer Dockerfile em infra/Dockerfile com targets `api` e `web` de produção
# (após merge do bootstrap monorepo).
#
# Uso na VM:
#   docker compose --env-file .env -f infra/oci/compose.yml up -d --build

name: ${COMPOSE_PROJECT_NAME:-clivyra}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clivyra}
      POSTGRES_USER: ${POSTGRES_USER:-clivyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Não publica 5432 na internet

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WEB_PORT: ${WEB_PORT:-3000}
      # Next/Nest public URL helpers if needed later
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    restart: unless-stopped

volumes:
  postgres_data:
