services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clivyra
      POSTGRES_USER: clivyra
      POSTGRES_PASSWORD: clivyra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clivyra -d clivyra"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    environment:
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://clivyra:clivyra@db:5432/clivyra?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
